<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Endless</title>
<link rel="stylesheet" href="endless.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="mp" class="url">
  <div id="mpH"><div id="mpE"><i></i><i></i><i></i></div><div id="mpT">ยังไม่ได้เลือกเพลง</div>
    <button id="mpP" title="เพลงก่อนหน้า"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg></button>
    <button id="mpS" title="เล่น / หยุด"><svg viewBox="0 0 24 24"><path id="mpSi" d="M8 5v14l11-7z"/></svg></button>
    <button id="mpN" title="เพลงถัดไป"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button></div>
  <div id="mpB"><div id="mpBf"></div></div>
  <div id="mpX"><div id="mpS2">วางลิงก์ YouTube ในช่องด้านล่าง</div>
    <div id="mpR"><span id="mpTm"><span id="mpC">0:00</span> / <span id="mpD">0:00</span></span><span class="sp"></span>
      <svg viewBox="0 0 24 24" style="opacity:.7"><path d="M4 9v6h4l5 4V5L8 9zM16 8.5a4.5 4.5 0 0 1 0 7z"/></svg><input id="mpV" type="range" min="0" max="100" value="60" title="ความดังเพลง">
      <button id="mpL" title="ใส่ลิงก์"><svg viewBox="0 0 24 24"><path d="M10.6 13.4a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1.2 1.2 1.4 1.4 1.2-1.2a2 2 0 0 1 2.8 2.8l-3 3a2 2 0 0 1-2.8 0zM13.4 10.6a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1.2-1.2-1.4-1.4-1.2 1.2a2 2 0 0 1-2.8-2.8l3-3a2 2 0 0 1 2.8 0z"/></svg></button></div>
    <input id="mpU" type="text" placeholder="ลิงก์ playlist หรือวิดีโอจาก YouTube" spellcheck="false"></div>
</div>
<div id="mpY"><div id="mpF"></div></div>
<div id="keys">W A S D ขับ · Shift เร่ง · P ขับอัตโนมัติ · - / + จำกัดความเร็ว · คลิกจอเพื่อจับเมาส์มองรอบ (Esc ปล่อย) · T ข้ามเวลา · R เลือกอากาศ · Y สุ่มอากาศ เปิด/ปิด · L ไฟหน้า · F กล้องบิน (Q/E ลงขึ้น) · M เสียง · G เต็มจอ · H ซ่อน/แสดงข้อความ</div>
<div id="err"></div>
<script src="src/boot.js"></script>
</body>
</html>
