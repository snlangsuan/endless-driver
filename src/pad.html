<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Endless - จอย</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;position:fixed;inset:0;overscroll-behavior:none;background:#0c1118;color:#e8eef6;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1.15fr 1fr;grid-template-rows:auto 1fr;gap:10px;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
#top{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#stat{margin-right:auto;font-size:13px;opacity:.85}
#stat b{font-size:18px;color:#ffd27a}
.b{background:#1b2533;border:1px solid #fff2;color:#e8eef6;border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}
.b.on,.b:active{background:#2d7df6;border-color:#2d7df6}
#steerBox{position:relative;border-radius:18px;background:#121a25;border:1px solid #fff1;display:flex;align-items:center;justify-content:center}
#wheel{width:min(78%,40vh);aspect-ratio:1;border-radius:50%;border:14px solid #2a3442;position:relative}
#wheel:after{content:"";position:absolute;left:50%;top:-14px;width:12px;height:18px;margin-left:-6px;background:#ff5a2a;border-radius:3px}
#wheel i{position:absolute;left:8%;right:8%;top:50%;height:12px;margin-top:-6px;background:#2a3442;border-radius:6px}
#steerVal{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;opacity:.6}
#mid{display:grid;grid-template-columns:1fr 1fr 1fr;grid-auto-rows:1fr;gap:6px}
#mid .b{display:flex;align-items:center;justify-content:center;text-align:center}
#pedals{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
.pedal{border-radius:18px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;font-weight:700;font-size:18px;border:1px solid #fff2}
#brake{background:#3a1d22}#gas{background:#183626}
.pedal.on{filter:brightness(1.8)}
#overlay{position:fixed;inset:0;background:#0c1118f2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;z-index:3}
#overlay.hide{display:none}
#overlay .big{font-size:22px;font-weight:700}
#rot{display:none}
@media (orientation:portrait){#rot{display:flex;position:fixed;inset:0;background:#0c1118;z-index:4;align-items:center;justify-content:center;font-size:18px;text-align:center;padding:30px}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="stat"><b id="kmh">0</b> กม./ชม. &nbsp; เกียร์ <b id="gear">-</b></div>
    <button class="b" id="tiltBtn">เอียงเลี้ยว: ปิด</button>
    <button class="b" data-a="win">หน้าต่าง</button>
    <button class="b" data-a="radioNext">วิทยุ</button>
    <button class="b" data-a="pause">เมนู / เริ่ม</button>
  </div>
  <div id="steerBox"><div id="wheel"><i></i></div><div id="steerVal">ลากหมุนพวงมาลัย</div></div>
  <div id="mid">
    <button class="b" data-a="blinkL">ไฟเลี้ยว ซ้าย</button>
    <button class="b" data-a="hazard">ฉุกเฉิน</button>
    <button class="b" data-a="blinkR">ไฟเลี้ยว ขวา</button>
    <button class="b" data-a="down">เกียร์ ลง</button>
    <button class="b" id="horn">แตร</button>
    <button class="b" data-a="up">เกียร์ ขึ้น</button>
    <button class="b" data-a="l1">มองซ้าย</button>
    <button class="b" data-a="l3">มองหลัง</button>
    <button class="b" data-a="l2">มองขวา</button>
    <button class="b" data-a="cam">กล้อง</button>
    <button class="b" data-a="auto">ขับอัตโนมัติ</button>
    <button class="b" data-a="cruise">ครูซ</button>
  </div>
  <div id="pedals"><div class="pedal" id="brake">เบรก</div><div class="pedal" id="gas">คันเร่ง</div></div>
</div>
<div id="overlay"><div class="big" id="msg">กำลังเชื่อมต่อกับเกม...</div><div id="sub" style="opacity:.7"></div></div>
<div id="rot">หมุนมือถือเป็นแนวนอน</div>
<script>
const $ = (id) => document.getElementById(id);
const room = new URLSearchParams(location.search).get('r') || '';
const st = { steer: 0, gas: 0, brake: 0 };
let ws = null, tilt = false, tiltSteer = 0, wheelSteer = 0, wheelActive = false;
function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?role=pad&room=${room}`);
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === 'ok') { $('overlay').classList.add('hide'); }
    else if (m.t === 'err') { $('msg').textContent = m.msg; $('overlay').classList.remove('hide'); ws.onclose = null; }
    else if (m.t === 'st') { $('kmh').textContent = m.kmh; $('gear').textContent = m.gear; }
  };
  ws.onclose = () => { $('msg').textContent = 'หลุดการเชื่อมต่อ กำลังต่อใหม่...'; $('overlay').classList.remove('hide'); setTimeout(connect, 1500); };
}
const send = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
if (!room) { $('msg').textContent = 'ไม่มีรหัสเกม'; $('sub').textContent = 'สแกน QR จากหน้าเมนูของเกมบนคอม'; } else connect();

// buttons -> game actions
document.querySelectorAll('[data-a]').forEach((el) => el.addEventListener('pointerdown', (e) => { e.preventDefault(); send({ t: 'act', a: el.dataset.a }); navigator.vibrate?.(15); }));
function hold(el, on, off) {
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch {} el.classList.add('on'); on(); });
  const up = () => { el.classList.remove('on'); off(); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
}
hold($('gas'), () => (st.gas = 1), () => (st.gas = 0));
hold($('brake'), () => (st.brake = 1), () => (st.brake = 0));
hold($('horn'), () => send({ t: 'horn', on: 1 }), () => send({ t: 'horn', on: 0 }));

// steering wheel: drag around its centre (max ±1.5 turns of lock shown as ±135 degrees)
{
  const box = $('steerBox'), w = $('wheel'); let prev = null, rot = 0;
  const ang = (e) => { const r = w.getBoundingClientRect(); return Math.atan2(e.clientX - (r.left + r.width / 2), -(e.clientY - (r.top + r.height / 2))); };
  box.addEventListener('pointerdown', (e) => { try { box.setPointerCapture(e.pointerId); } catch {} prev = ang(e); wheelActive = true; });
  box.addEventListener('pointermove', (e) => {
    if (prev === null) return; const a = ang(e); let d = a - prev; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI;
    prev = a; rot = Math.max(-2.36, Math.min(2.36, rot + d)); wheelSteer = -rot / 2.36; // game convention: negative = right
  });
  const up = () => { prev = null; wheelActive = false; };
  box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
  (function spring() { if (!wheelActive) { rot *= 0.8; wheelSteer = -rot / 2.36; } w.style.transform = `rotate(${rot}rad)`; requestAnimationFrame(spring); })();
}
// no zooming / scrolling: two fingers (wheel + pedal) must never become a pinch
for (const ev of ['touchstart', 'touchmove']) document.addEventListener(ev, (e) => { if (e.target.id !== 'tiltBtn') e.preventDefault(); }, { passive: false });
for (const ev of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick', 'contextmenu']) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
// tilt steering: motion sensors only work on https pages (bun run serve provides one); iPhone also asks for permission
if (!window.isSecureContext) { $('tiltBtn').textContent = 'เอียงเลี้ยว: ต้องเปิดแบบ https'; $('tiltBtn').disabled = true; }
let tiltBusy = false;
const tiltToggle = async () => {
  if (tiltBusy || !window.isSecureContext) return; tiltBusy = true; setTimeout(() => (tiltBusy = false), 400);
  if (!tilt && typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
    try { if ((await DeviceOrientationEvent.requestPermission()) !== 'granted') return; } catch { $('tiltBtn').textContent = 'เอียงเลี้ยว: ใช้ไม่ได้'; return; }
  }
  tilt = !tilt; $('tiltBtn').textContent = 'เอียงเลี้ยว: ' + (tilt ? 'เปิด' : 'ปิด'); $('tiltBtn').classList.toggle('on', tilt);
  if (tilt) { gotTilt = false; setTimeout(() => { if (tilt && !gotTilt) $('tiltBtn').textContent = 'เอียงเลี้ยว: ไม่พบเซนเซอร์'; }, 1500); }
};
$('tiltBtn').addEventListener('touchend', (e) => { e.preventDefault(); tiltToggle(); });
$('tiltBtn').addEventListener('click', tiltToggle);
let gotTilt = false;
addEventListener('deviceorientation', (e) => {
  if (e.beta == null) return; gotTilt = true;
  const ang = screen.orientation?.angle ?? window.orientation ?? 0;
  const a = ang === 90 ? e.beta : (ang === -90 || ang === 270) ? -e.beta : e.gamma;
  tiltSteer = Math.max(-1, Math.min(1, -a / 28));
});
// stream input ~30 times a second
setInterval(() => {
  st.steer = wheelActive || !tilt ? wheelSteer : tiltSteer;
  $('steerVal').textContent = tilt && !wheelActive ? 'เอียงมือถือเพื่อเลี้ยว' : 'ลากหมุนพวงมาลัย';
  send({ t: 'in', s: +st.steer.toFixed(3), g: st.gas, b: st.brake });
}, 33);
// keep the screen awake while playing
navigator.wakeLock?.request?.('screen').catch(() => {});
document.addEventListener('visibilitychange', () => { if (!document.hidden) navigator.wakeLock?.request?.('screen').catch(() => {}); });
</script>
</body>
</html>
